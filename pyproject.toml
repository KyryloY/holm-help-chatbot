[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "holm-help"
version = "0.1.0"
description = "Holm Help — LangGraph + Chainlit customer-support demo for Holm Home Textiles"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Holm Help Demo" }]
dependencies = [
  "langgraph>=1.0,<2",
  "langgraph-checkpoint-sqlite>=2.0,<4",
  "langchain>=0.3,<2",
  "langchain-google-genai>=2.0,<5",
  "chainlit>=2.0,<3",
  "python-dotenv>=1.0,<2",
  "aiosqlite>=0.20,<1",
  "sqlalchemy>=2.0,<3",
  "greenlet>=3.0,<4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.24",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
